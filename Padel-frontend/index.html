<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Indoor Padel - Iniciar Sesión</title>
    
<!-- CDN de Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- configuración de colores -->
    <script src="js/tailwind-config.js"></script>
    
    <!-- Fuentes e Íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- CSS externo -->
    <link href="css/styles.css" rel="stylesheet"/>
    
    <!-- Lógica JS -->
    <script src="js/servicios/almacenamiento.js?v=1" defer></script>
    <script src="js/login.js?v=1" defer></script>
    <script src="js/layout.js?v=1" defer></script>
    <script src="js/app.js?v=1" defer></script>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex items-center justify-center p-4">
    
    <!-- CONTENEDOR DE LOGIN -->
    <div id="login-container" class="bg-surface-container-low p-6 sm:p-12 rounded-xl w-full max-w-md shadow-[0px_24px_48px_-12px_rgba(23,28,31,0.08)]">
        <div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm">
            <div class="flex justify-center mb-6">
                <span class="material-symbols-outlined text-primary text-5xl" data-icon="sports_tennis" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
            </div>
            <h1 class="font-headline text-3xl font-bold text-center text-on-surface mb-8 tracking-tight">Iniciar Sesión</h1>
            
            <div class="hidden flex items-center gap-2 bg-red-50 text-red-900 p-3 rounded-lg mb-6 border border-red-100" id="alerta-error">
                <span class="material-symbols-outlined text-red-600">error</span>
                <span class="text-sm font-medium">Correo o contraseña incorrectos</span>
            </div>
            
            <form action="#" class="space-y-6" method="POST">
                <div>
                    <label class="block font-label text-sm font-medium text-on-surface mb-2" for="email">Correo electrónico</label>
                    <input class="w-full bg-surface-container-highest border-transparent rounded-lg px-4 py-3 text-on-surface placeholder-on-surface-variant focus:border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:bg-surface-container-lowest transition-colors duration-200" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block font-label text-sm font-medium text-on-surface" for="password">Contraseña</label>
                    </div>
                    <div class="relative flex items-center">
                        <input class="w-full bg-surface-container-highest border-transparent rounded-lg pl-4 pr-12 py-3 text-on-surface placeholder-on-surface-variant focus:border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:bg-surface-container-lowest transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                        <button id="btn-toggle-password" class="absolute right-0 top-0 bottom-0 h-full text-slate-500 hover:text-slate-700 focus:outline-none px-4 flex items-center justify-center z-10" type="button" onclick="const p = document.getElementById('password'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.innerHTML = '<span class=\'material-symbols-outlined text-xl font-light\'>' + (isPass ? 'visibility_off' : 'visibility') + '</span>';">
                              <span class="material-symbols-outlined text-xl font-light">visibility</span>
                          </button>
                    </div>
                    <p class="hidden text-sm text-red-600 mt-1" id="error-password">La contraseña debe tener al menos 6 caracteres</p>
                </div>
                <div>
                    <button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-base font-headline font-bold text-on-primary bg-primary hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" id="btn-login" type="submit">
                        <svg class="hidden animate-spin mr-2 h-5 w-5 text-white" fill="none" id="spinner-login" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
                        </svg>
                        Ingresar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONTENEDOR APP SHELL -->
    <div id="app-shell" class="hidden w-full h-full flex">
        <!-- Sidebar -->
        <nav id="sidebar-container" class="h-screen w-72 flex flex-col fixed left-0 top-0 bg-surface-container-low dark:bg-surface-dim flex-shrink-0 z-50 transition-transform">
            <div class="flex flex-col h-full p-6 gap-2">
                <!-- Brand Logo / Header -->
                <div class="flex items-center gap-3 mb-8 px-2">
                    <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
                    </div>
                    <div>
                        <h1 class="font-headline text-2xl font-black tracking-tighter text-on-surface dark:text-surface-bright leading-none">Indoor Padel</h1>
                        <p class="font-body text-xs text-secondary mt-1">Gestión Central</p>
                    </div>
                </div>

                <!-- Navigation Links (Dynamic) -->
                <div id="sidebar-menu" class="flex-1 space-y-1 overflow-y-auto">
                    <!-- Links injected via layout.js -->
                </div>

                <!-- Footer Links -->
                <div class="mt-auto pt-4 space-y-1">
                    <button id="btn-cerrar-sesion" class="w-full flex items-center gap-4 px-6 py-4 text-error bg-error-container/20 hover:bg-error-container/40 transition-colors duration-300 rounded-xl font-bold">
                        <span class="material-symbols-outlined">logout</span>
                        <span class="font-body">Cerrar Sesión</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Wrapper -->
        <div id="main-wrapper" class="flex-1 flex flex-col h-screen overflow-hidden md:ml-72 w-full transition-all">
            <!-- TopAppBar -->
            <header class="w-full h-20 sticky top-0 z-40 bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-xl flex-shrink-0 flex items-center justify-between px-6 md:px-10 border-b border-surface-variant/30">
                <div class="flex-1 flex items-center gap-4">
                    <button id="btn-toggle-menu" class="md:hidden p-2 text-on-surface hover:bg-surface-container-low transition-colors rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h2 id="topbar-title" class="font-headline text-xl font-bold text-on-surface">Panel de Control</h2>
                </div>
                <div class="flex items-center gap-4">
                    <button class="p-2 text-secondary hover:bg-surface-container-low transition-colors rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <div class="h-8 w-px bg-outline-variant/30 mx-2"></div>
                    <button class="flex items-center gap-3 hover:bg-surface-container-low p-2 pr-4 rounded-full transition-colors">
                        <div class="h-8 w-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-sm" id="topbar-profile-initials">--</div>
                        <div class="text-left hidden md:block">
                            <p class="text-sm font-semibold text-on-surface font-headline leading-tight" id="topbar-profile-name">Usuario</p>
                            <p class="text-xs text-secondary leading-tight" id="topbar-profile-role">Rol</p>
                        </div>
                    </button>
                    <button class="btn-cerrar-sesion flex items-center justify-center p-2 text-error hover:bg-error-container/20 transition-colors rounded-full ml-2" title="Cerrar Sesión">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <main id="contenido-dinamico" class="flex-1 overflow-y-auto w-full relative fade-in">
                <!-- Views injected here by app.js -->
            </main>
        </div>
    </div>
    <script src="js/servicios/almacenamiento.js"></script>
    <script src="js/app.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/login.js"></script>
    
    <script src="js/notificaciones.js"></script>
    <script src="js/modo-oscuro.js"></script>
</body>
</html>
</body>
</html>
