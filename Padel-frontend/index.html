<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Indoor Padel - Sistema de Gestión</title>
    
    <!-- CDN de Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Configuración de colores -->
    <script src="js/tailwind-config.js"></script>
    
    <!-- Fuentes e Íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- CSS externo -->
    <link href="css/styles.css" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex items-center justify-center p-4">
    
    <!-- CONTENEDOR DE LOGIN -->
    <div id="login-container" class="bg-surface-container-low p-6 sm:p-10 rounded-2xl w-full max-w-md shadow-[0px_24px_48px_-12px_rgba(23,28,31,0.08)] border border-outline-variant/20">
        <div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm border border-outline-variant/10">
            <div class="flex flex-col items-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center shadow-sm mb-3">
                    <span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
                </div>
                <span class="text-xs font-bold uppercase tracking-widest text-secondary">Indoor Padel Club</span>
            </div>
            <h1 class="font-headline text-2xl font-extrabold text-center text-on-surface mb-2 tracking-tight">Iniciar Sesión</h1>
            <p class="text-center text-xs text-on-surface-variant mb-6">Ingrese sus credenciales para acceder al panel</p>
            
            <div class="hidden flex items-center gap-2 bg-red-50 text-red-900 p-3.5 rounded-xl mb-6 border border-red-200" id="alerta-error">
                <span class="material-symbols-outlined text-red-600 text-[20px]">error</span>
                <span class="text-sm font-medium">Correo o contraseña incorrectos</span>
            </div>
            
            <form action="#" class="space-y-5" method="POST">
                <div>
                    <label class="block font-label text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-2" for="email">Correo electrónico</label>
                    <input class="w-full bg-surface-container-highest/70 border border-outline-variant/30 rounded-xl px-4 py-3 text-sm text-on-surface placeholder-on-surface-variant/60 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest focus:outline-none transition-all duration-200" id="email" name="email" placeholder="usuario@paddle.com" required="" type="email"/>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block font-label text-xs font-bold uppercase tracking-wider text-on-surface-variant" for="password">Contraseña</label>
                    </div>
                    <div class="relative flex items-center">
                        <input class="w-full bg-surface-container-highest/70 border border-outline-variant/30 rounded-xl pl-4 pr-12 py-3 text-sm text-on-surface placeholder-on-surface-variant/60 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest focus:outline-none transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                        <button id="btn-toggle-password" class="absolute right-0 top-0 bottom-0 h-full text-slate-500 hover:text-slate-700 focus:outline-none px-4 flex items-center justify-center z-10" type="button" onclick="const p = document.getElementById('password'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.innerHTML = '<span class=\'material-symbols-outlined text-xl font-light\'>' + (isPass ? 'visibility_off' : 'visibility') + '</span>';">
                            <span class="material-symbols-outlined text-xl font-light">visibility</span>
                        </button>
                    </div>
                    <p class="hidden text-xs text-red-600 mt-1.5 font-medium" id="error-password">La contraseña debe tener al menos 6 caracteres</p>
                </div>
                <div class="pt-2">
                    <button class="w-full flex items-center justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-headline font-bold text-on-primary bg-primary hover:bg-opacity-95 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" id="btn-login" type="submit">
                        <svg class="hidden animate-spin mr-2 h-5 w-5 text-white" fill="none" id="spinner-login" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
                        </svg>
                        Ingresar al Sistema
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONTENEDOR APP SHELL -->
    <div id="app-shell" class="hidden w-full h-full flex bg-surface">
        <!-- Sidebar -->
        <nav id="sidebar-container" class="h-screen w-72 flex flex-col fixed left-0 top-0 bg-surface-container-lowest border-r border-outline-variant/25 flex-shrink-0 z-50 transition-transform">
            <div class="flex flex-col h-full p-6 gap-2">
                <!-- Brand Logo / Header -->
                <div class="flex items-center gap-3.5 mb-8 px-2 pb-5 border-b border-outline-variant/15">
                    <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center flex-shrink-0 shadow-sm">
                        <span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
                    </div>
                    <div class="text-left">
                        <h1 class="font-headline text-xl font-extrabold tracking-tight text-on-surface leading-none">Indoor Padel</h1>
                        <p class="font-body text-xs text-secondary font-medium mt-1">Sistema de Gestión</p>
                    </div>
                </div>

                <!-- Navigation Links (Dynamic) -->
                <div id="sidebar-menu" class="flex-1 space-y-1.5 overflow-y-auto pr-1">
                    <!-- Links injected via layout.js -->
                </div>

                <!-- Footer Links -->
                <div class="mt-auto pt-4 border-t border-outline-variant/15">
                    <button id="btn-cerrar-sesion" class="w-full flex items-center gap-3.5 px-5 py-3.5 text-error bg-error-container/25 hover:bg-error-container/45 transition-colors duration-200 rounded-xl font-bold text-sm">
                        <span class="material-symbols-outlined text-[20px]">logout</span>
                        <span class="font-body">Cerrar Sesión</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Wrapper -->
        <div id="main-wrapper" class="flex-1 flex flex-col h-screen overflow-hidden md:ml-72 w-full transition-all bg-surface">
            <!-- TopAppBar -->
            <header class="w-full h-20 sticky top-0 z-40 bg-surface-container-lowest/90 backdrop-blur-md flex-shrink-0 flex items-center justify-between px-6 md:px-10 border-b border-outline-variant/20">
                <div class="flex-1 flex items-center gap-4">
                    <button id="btn-toggle-menu" class="md:hidden p-2 text-on-surface hover:bg-surface-container-low transition-colors rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <div>
                        <h2 id="topbar-title" class="font-headline text-xl font-extrabold text-on-surface tracking-tight">Panel de Control</h2>
                    </div>
                </div>
                <div class="flex items-center gap-3 md:gap-4">
                    <!-- Campanita de Notificaciones interactiva -->
                    <div class="relative">
                        <button id="btn-notificaciones" class="relative p-2.5 text-secondary hover:text-on-surface hover:bg-surface-container-low transition-colors rounded-xl flex items-center justify-center cursor-pointer border border-outline-variant/15" title="Centro de Notificaciones">
                            <span class="material-symbols-outlined text-[20px]">notifications</span>
                            <span id="badge-notificaciones" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-error rounded-full ring-2 ring-surface-container-lowest"></span>
                        </button>
                        
                        <!-- Panel Dropdown de Notificaciones -->
                        <div id="panel-notificaciones-dropdown" class="hidden absolute right-0 mt-3 w-80 sm:w-96 bg-surface-container-lowest rounded-2xl shadow-2xl border border-outline-variant/25 z-50 flex-col overflow-hidden transition-all duration-200">
                            <!-- Inyectado dinámicamente por notificaciones.js -->
                        </div>
                    </div>

                    <div class="h-8 w-px bg-outline-variant/25 mx-1"></div>
                    
                    <!-- Píldora de Perfil del Usuario -->
                    <div class="flex items-center gap-3 bg-surface-container-low px-3.5 py-2 rounded-xl border border-outline-variant/20">
                        <div class="h-8 w-8 rounded-lg bg-primary text-on-primary flex items-center justify-center font-bold text-xs shadow-sm" id="topbar-profile-initials">--</div>
                        <div class="text-left hidden md:block">
                            <p class="text-sm font-bold text-on-surface font-headline leading-tight" id="topbar-profile-name">Usuario</p>
                            <p class="text-[11px] text-secondary font-semibold uppercase tracking-wider leading-tight mt-0.5" id="topbar-profile-role">Rol</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <main id="contenido-dinamico" class="flex-1 overflow-y-auto w-full relative fade-in">
                <!-- Views injected here by app.js -->
            </main>
        </div>
    </div>
    <script src="js/servicios/almacenamiento.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/login.js"></script>
    <script src="js/app.js"></script>
    <script src="js/notificaciones.js"></script>
    <script src="js/modo-oscuro.js"></script>
</body>
</html>
