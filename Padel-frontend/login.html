<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kinetic Court - Iniciar Sesión</title>
    
<!-- 1. Primero el CDN de Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- 2. Después tu configuración de colores -->
    <script src="js/tailwind-config.js"></script>
    
    <!-- Fuentes e Íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tu CSS externo -->
    <link href="css/styles.css" rel="stylesheet"/>
    
    <!-- Tu Lógica JS -->
    <script src="js/login.js" defer></script>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex items-center justify-center p-4">
    <!-- Container for "nested" depth -->
    <div class="bg-surface-container-low p-6 sm:p-12 rounded-xl w-full max-w-md shadow-[0px_24px_48px_-12px_rgba(23,28,31,0.08)]">
        <!-- Interactive Element Layer -->
        <div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm">
            <!-- Logo / Brand Anchor -->
            <div class="flex justify-center mb-6">
                <span class="material-symbols-outlined text-primary text-5xl" data-icon="sports_tennis" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
            </div>
            <!-- Title -->
            <h1 class="font-headline text-3xl font-bold text-center text-on-surface mb-8 tracking-tight">Iniciar Sesión</h1>
            
            <!-- Form -->
            <div class="hidden flex items-center gap-2 bg-red-50 text-red-900 p-3 rounded-lg mb-6 border border-red-100" id="alerta-error">
                <span class="material-symbols-outlined text-red-600">error</span>
                <span class="text-sm font-medium">Correo o contraseña incorrectos</span>
            </div>
            
            <form action="#" class="space-y-6" method="POST">
                <!-- Email Field -->
                <div>
                    <label class="block font-label text-sm font-medium text-on-surface mb-2" for="email">Correo electrónico</label>
                    <input class="w-full bg-surface-container-highest border-transparent rounded-lg px-4 py-3 text-on-surface placeholder-on-surface-variant focus:border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:bg-surface-container-lowest transition-colors duration-200" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
                </div>
                <!-- Password Field -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block font-label text-sm font-medium text-on-surface" for="password">Contraseña</label>
                        <a class="font-label text-sm text-primary font-semibold hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="relative flex items-center">
                        <input class="w-full bg-surface-container-highest border-transparent rounded-lg pl-4 pr-12 py-3 text-on-surface placeholder-on-surface-variant focus:border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:bg-surface-container-lowest transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                        <button class="absolute right-0 text-slate-500 hover:text-slate-700 focus:outline-none px-3 flex items-center justify-center" type="button">
                            <span class="material-symbols-outlined text-xl font-light">visibility</span>
                        </button>
                    </div>
                    <p class="hidden text-sm text-red-600 mt-1" id="error-password">La contraseña debe tener al menos 6 caracteres</p>
                </div>
                <!-- Submit Button -->
                <div>
                    <button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-base font-headline font-bold text-on-primary bg-primary hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" id="btn-login" type="submit">
                        <svg class="hidden animate-spin mr-2 h-5 w-5 text-white" fill="none" id="spinner-login" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
                        </svg>
                        Ingresar
                    </button>
                </div>
            </form>
            
            <!-- Secondary Action -->
            <div class="mt-6 text-center">
                <a class="font-label text-sm text-primary font-semibold hover:bg-surface-container-high py-2 px-4 rounded-lg transition-colors inline-block" href="#">
                    Crear una cuenta nueva
                </a>
            </div>
        </div>
    </div>
</body>
</html>
