<div class="flex-1 flex overflow-hidden p-6 gap-6">
    <section class="w-[65%] flex flex-col bg-surface-container-low rounded-xl overflow-hidden relative">
        <div class="p-4 bg-surface-container-lowest flex items-center justify-between z-10">
            <h3 id="fecha-hoy-txt" class="font-headline font-bold text-xl text-on-surface">Hoy</h3>
            <div class="flex items-center gap-6">
                <div class="flex gap-2">
                    <span class="px-3 py-1 bg-surface-container text-on-surface-variant rounded-full text-xs font-semibold">Cancha 1</span>
                    <span class="px-3 py-1 bg-surface-container text-on-surface-variant rounded-full text-xs font-semibold">Cancha 2</span>
                    <span class="px-3 py-1 bg-surface-container text-on-surface-variant rounded-full text-xs font-semibold">Cancha 3</span>
                </div>
                <button id="btn-abrir-modal-turno" class="bg-primary text-on-primary px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">
                    <span class="material-symbols-outlined text-[18px]">add</span> Agendar
                </button>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto relative p-4 scrollbar-hide" id="calendario-scroll">
            <div class="absolute left-0 top-0 w-16 h-[1200px] flex flex-col pt-4 z-10 bg-surface-container-low/90 backdrop-blur-sm border-r border-outline-variant/15" id="columna-horas"></div>
            <div class="ml-16 h-[1200px] relative" id="grilla-canchas">
                <div class="flex h-full absolute inset-0 pt-0" id="columnas-canchas"></div>
            </div>
        </div>
    </section>

    <section class="w-[35%] flex flex-col gap-4">
        <div class="bg-surface-container-lowest rounded-xl p-5">
            <h3 class="font-headline font-bold text-lg text-on-surface mb-4">Venta Rapida</h3>
            <div class="grid grid-cols-4 gap-3">
                <button class="btn-venta-rapida flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors gap-2" data-id="3" data-nombre="Agua Mineral" data-precio="1500">
                    <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">water_drop</span>
                    <span class="text-xs font-semibold text-on-surface-variant">Agua</span>
                </button>
                <button class="btn-venta-rapida flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors gap-2" data-id="4" data-nombre="Gatorade" data-precio="2200">
                    <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">local_drink</span>
                    <span class="text-xs font-semibold text-on-surface-variant">Gatorade</span>
                </button>
                <button class="btn-venta-rapida flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors gap-2" data-id="1" data-nombre="Tubo Pelotas" data-precio="9500">
                    <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
                    <span class="text-xs font-semibold text-on-surface-variant">Pelotas</span>
                </button>
                <button class="btn-venta-rapida flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors gap-2" data-id="2" data-nombre="Alquiler Pala" data-precio="4000">
                    <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">sports_kabaddi</span>
                    <span class="text-xs font-semibold text-on-surface-variant">Paleta</span>
                </button>
            </div>
        </div>

        <div class="bg-surface-container-lowest rounded-xl p-5 flex-1 flex flex-col shadow-sm">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-headline font-bold text-lg text-on-surface">Cuenta Actual</h3>
                <span id="ticket-id" class="text-xs font-bold text-primary bg-primary-container/20 px-2 py-1 rounded-md">Ticket #001</span>
            </div>
            
            <div id="ticket-items" class="flex-1 overflow-y-auto space-y-4 mb-4">
                <p class="text-center text-on-surface-variant text-sm mt-10">El ticket está vacío.</p>
            </div>
            
            <div class="pt-4 border-t border-outline-variant/15 mt-auto">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xl font-headline font-extrabold text-on-surface">Total</span>
                    <span id="ticket-total" class="text-2xl font-headline font-extrabold text-primary">$0</span>
                </div>
                <button id="btn-cobrar-ticket" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl py-4 px-4 font-headline font-bold text-lg hover:shadow-[0px_24px_48px_-12px_rgba(68,105,0,0.3)] transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">point_of_sale</span> Cobrar Total 
                </button>
            </div>
        </div>
    </section>
</div>

<!-- Modal Nuevo Turno -->
<dialog id="modal-agenda" class="bg-transparent m-auto p-0 backdrop:bg-surface-container-highest/60 backdrop:backdrop-blur-sm transition-all w-full max-w-md">
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-2xl flex flex-col gap-4 border border-outline-variant/20">
        <h2 class="font-headline font-extrabold text-2xl text-on-surface">Nuevo Turno</h2>
        <form id="form-agenda" class="flex flex-col gap-4">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm text-on-surface-variant font-semibold">Cancha</label>
                    <select id="agenda-cancha-id" class="w-full bg-surface-container-highest rounded-xl px-4 py-3 border-none mt-1 focus:ring-2 focus:ring-primary cursor-pointer font-bold">
                        <option value="1">Cancha 1</option>
                        <option value="2">Cancha 2</option>
                        <option value="3">Cancha 3</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-on-surface-variant font-semibold">Fecha</label>
                    <input type="date" id="agenda-fecha" required class="w-full bg-surface-container-highest rounded-xl px-4 py-3 border-none mt-1 focus:ring-2 focus:ring-primary">
                </div>
            </div>
            
            <div>
                <label class="text-sm text-on-surface-variant font-semibold">Cliente (Seleccionar o escribir)</label>
                <input type="text" id="agenda-cliente" list="lista-clientes-agenda" required class="w-full bg-surface-container-highest rounded-xl px-4 py-3 border-none mt-1 focus:ring-2 focus:ring-primary" placeholder="Buscar socio o nombre...">
                <datalist id="lista-clientes-agenda"></datalist>
            </div>
            
            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1">
                    <label class="text-sm text-on-surface-variant font-semibold">Hora Inicio</label>
                    <input type="time" id="agenda-hora" required class="w-full bg-surface-container-highest rounded-xl px-2 py-3 border-none mt-1 focus:ring-2 focus:ring-primary">
                </div>
                <div class="col-span-1">
                    <label class="text-sm text-on-surface-variant font-semibold">Duración</label>
                    <select id="agenda-duracion" class="w-full bg-surface-container-highest rounded-xl px-2 py-3 border-none mt-1 focus:ring-2 focus:ring-primary cursor-pointer">
                        <option value="60">60 min</option>
                        <option value="90" selected>90 min</option>
                        <option value="120">120 min</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="text-sm text-on-surface-variant font-semibold">Estado Pago</label>
                    <select id="agenda-pago" class="w-full bg-surface-container-highest text-[11px] font-bold rounded-xl px-1 py-3 border-none mt-1 cursor-pointer">
                        <option value="PENDIENTE">❌ No Paga</option>
                        <option value="SENA">⏳ Seña</option>
                        <option value="PAGADO">✅ Total</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-4">
                <button type="button" id="btn-cancelar-agenda" class="font-bold text-secondary px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors">Cancelar</button>
                <button type="submit" class="bg-primary text-on-primary px-6 py-3 rounded-xl font-bold hover:shadow-lg transition-all">Agendar</button>
            </div>
        </form>
    </div>
</dialog>

<!-- Modal Interactivo Opciones de Turno -->
<dialog id="modal-opciones-turno" class="bg-transparent m-auto p-0 backdrop:bg-surface-container-highest/60 backdrop:backdrop-blur-sm transition-all w-full max-w-sm">
    <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-2xl flex flex-col gap-5 border border-outline-variant/20">
        <div class="flex justify-between items-start">
            <div>
                <h2 id="opciones-turno-titulo" class="font-headline font-extrabold text-xl text-on-surface">Turno</h2>
                <p class="text-sm text-on-surface-variant font-medium">¿Qué querés agregar al ticket?</p>
            </div>
            <button id="btn-cerrar-opciones" class="text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined">close</span></button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button class="btn-opcion-rapida-turno col-span-2 bg-primary-container text-on-primary-container py-3 px-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-all active:scale-95" data-tipo="cancha">
                <span class="material-symbols-outlined">sports_tennis</span> Enviar Cancha al Ticket
            </button>
            <button class="btn-opcion-rapida-turno bg-surface-container text-on-surface py-3 px-4 rounded-xl font-bold flex flex-col items-center gap-1 hover:bg-surface-container-high transition-all active:scale-95" data-tipo="producto" data-id="3" data-nombre="Agua Mineral" data-precio="1500">
                <span class="material-symbols-outlined text-primary">water_drop</span> Agua
            </button>
            <button class="btn-opcion-rapida-turno bg-surface-container text-on-surface py-3 px-4 rounded-xl font-bold flex flex-col items-center gap-1 hover:bg-surface-container-high transition-all active:scale-95" data-tipo="producto" data-id="4" data-nombre="Gatorade" data-precio="2200">
                <span class="material-symbols-outlined text-primary">local_drink</span> Gatorade
            </button>
        </div>

        <hr class="border-outline-variant/20 my-1">

        <div>
            <p class="text-sm text-on-surface-variant font-bold mb-2">Cambiar Estado de Pago</p>
            <div class="flex gap-2">
                <button class="btn-cambiar-estado-turno flex-1 bg-[#e8f5e9] text-[#2e7d32] py-2 rounded-lg font-bold text-xs border border-[#4caf50]/30 hover:bg-[#c8e6c9] transition-colors" data-estado="PAGADO">Pagado</button>
                <button class="btn-cambiar-estado-turno flex-1 bg-[#e3f2fd] text-[#1565c0] py-2 rounded-lg font-bold text-xs border border-[#2196f3]/30 hover:bg-[#bbdefb] transition-colors" data-estado="SENA">Seña</button>
                <button class="btn-cambiar-estado-turno flex-1 bg-[#fff3e0] text-[#e65100] py-2 rounded-lg font-bold text-xs border border-[#ffb74d]/30 hover:bg-[#ffe0b2] transition-colors" data-estado="PENDIENTE">No Paga</button>
            </div>
        </div>

        <!-- NUEVO: BOTÓN FINALIZAR -->
        <button id="btn-finalizar-turno-modal" class="w-full bg-[#1a1a1a] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-black transition-all shadow-md">
            <span class="material-symbols-outlined">done_all</span> Finalizar y Quitar de Agenda
        </button>

        <div class="text-center mt-1">
            <button id="btn-eliminar-turno-modal" class="text-error font-bold text-xs hover:underline px-2 py-1">Cancelar / Borrar Definitivo</button>
        </div>
    </div>
</dialog>
<script src="js/controladores/empleado-agenda.js"></script>
