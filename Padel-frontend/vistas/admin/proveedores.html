<div class="flex justify-between items-end mb-8">
    <div>
        <h1 class="font-headline text-4xl font-extrabold text-on-surface">Proveedores</h1>
        <p class="text-on-surface-variant mt-2">Gestiona tus distribuidores y servicios.</p>
    </div>
    <button id="btn-nuevo-proveedor" class="bg-primary text-on-primary px-6 py-3 rounded-xl font-bold flex items-center gap-2">
        <span class="material-symbols-outlined">add</span> Nuevo Proveedor
    </button>
</div>

<div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-left text-sm">
        <thead class="bg-surface-container-low text-on-surface-variant uppercase">
            <tr>
                <th class="px-6 py-4 font-semibold">Empresa</th>
                <th class="px-6 py-4 font-semibold">Rubro</th>
                <th class="px-6 py-4 font-semibold">Contacto</th>
                <th class="px-6 py-4 text-right font-semibold">Acciones</th>
            </tr>
        </thead>
        <tbody id="proveedores-table-body" class="divide-y divide-outline-variant/10"></tbody>
    </table>
</div>

<dialog id="modal-proveedor" class="bg-transparent m-auto p-0 backdrop:bg-surface-container-highest/60 backdrop:backdrop-blur-sm transition-all w-full max-w-sm">
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-2xl flex flex-col gap-4">
        <h2 id="modal-proveedor-titulo" class="font-headline font-extrabold text-2xl">Nuevo Proveedor</h2>
        <form id="form-proveedor" class="flex flex-col gap-4">
            <input type="hidden" id="prov-id">
            <input type="text" id="prov-empresa" placeholder="Empresa" required class="w-full bg-surface-container-highest rounded-xl px-4 py-3 border-none">
            <input type="text" id="prov-rubro" placeholder="Rubro (Ej. Bebidas, Limpieza)" required class="w-full bg-surface-container-highest rounded-xl px-4 py-3 border-none">
            <input type="text" id="prov-telefono" placeholder="Teléfono" class="w-full bg-surface-container-highest rounded-xl px-4 py-3 border-none">
            <div class="flex justify-end gap-3 mt-4">
                <button type="button" id="btn-cancelar-prov" class="font-bold text-secondary">Cancelar</button>
                <button type="submit" class="bg-primary text-on-primary px-6 py-3 rounded-xl font-bold">Guardar</button>
            </div>
        </form>
    </div>
</dialog>
<script src="js/controladores/admin-proveedores.js"></script>
