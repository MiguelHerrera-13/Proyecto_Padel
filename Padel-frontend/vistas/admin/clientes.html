<div class="flex justify-between items-end mb-10">
    <div>
        <h1 class="font-headline text-display-sm font-bold tracking-tight text-on-surface mb-2">Gestión de Usuarios</h1>
        <p id="total-clientes-txt" class="text-on-surface-variant font-body">Cargando usuarios...</p>
    </div>
    <button id="btn-nuevo-usuario" class="bg-gradient-to-r from-primary to-primary-container text-on-primary px-6 py-3 rounded-xl font-headline font-bold flex items-center gap-2 hover:shadow-[0px_12px_24px_-8px_rgba(68,105,0,0.3)] transition-all">
        <span class="material-symbols-outlined font-bold text-[20px]">person_add</span> Nuevo Usuario 
    </button>
</div>

<div class="flex flex-col md:flex-row gap-4 mb-8 bg-surface-container-low p-4 rounded-xl">
    <div class="relative flex-1 group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">search</span>
        <input id="input-buscador-clientes" class="w-full pl-12 pr-4 py-3 bg-surface-container-highest text-on-surface rounded-xl border-none focus:ring-0 focus:bg-surface-container-lowest transition-all shadow-sm focus:shadow-[inset_0_0_0_2px_rgba(68,105,0,0.4)] placeholder:text-on-surface-variant/60 font-body outline-none" placeholder="Buscar por nombre, correo o teléfono..." type="text" />
    </div>
    <div class="relative w-full md:w-64 group">
        <select id="select-filtro-estado" class="bg-none w-full pl-4 pr-10 py-3 bg-surface-container-highest text-on-surface rounded-xl border-none focus:ring-0 focus:bg-surface-container-lowest transition-all shadow-sm focus:shadow-[inset_0_0_0_2px_rgba(68,105,0,0.4)] font-body outline-none appearance-none cursor-pointer">
            <option value="TODOS">Todos los Estados</option>
            <option value="ACTIVO">Activos / Al Día</option>
            <option value="CON_DEUDA">Con Deuda</option>
            <option value="BLOQUEADO">Bloqueados</option>
        </select>
        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">expand_more</span>
    </div>
</div>

<div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-surface-container-low text-on-surface-variant font-headline text-sm uppercase tracking-wider">
                    <th class="px-6 py-4 font-semibold rounded-tl-xl">Usuario / Staff</th>
                    <th class="px-6 py-4 font-semibold">Contacto</th>
                    <th class="px-6 py-4 font-semibold">Actividad</th>
                    <th class="px-6 py-4 font-semibold">Estado</th>
                    <th class="px-6 py-4 font-semibold text-right rounded-tr-xl">Acciones</th>
                </tr>
            </thead>
            <tbody id="clientes-table-body" class="font-body text-sm divide-y divide-outline-variant/10">
                </tbody>
        </table>
    </div>
    <div class="bg-surface-container-low px-6 py-4 flex items-center justify-between rounded-b-xl">
        <p id="txt-mostrando" class="text-sm text-on-surface-variant">Mostrando 0 resultados</p>
        <div class="flex items-center gap-1">
            <button class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:bg-surface-container-high rounded-lg transition-colors disabled:opacity-50" disabled> Anterior </button>
            <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-primary text-on-primary font-bold text-sm"> 1 </button>
            <button class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:bg-surface-container-high rounded-lg transition-colors"> Siguiente </button>
        </div>
    </div>
</div>

<dialog id="modal-usuario" class="bg-transparent m-auto p-0 backdrop:bg-surface-container-highest/60 backdrop:backdrop-blur-sm transition-all w-full max-w-lg">
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-2xl border border-outline-variant/20 flex flex-col gap-6">
        <div class="flex justify-between items-center">
            <h2 id="modal-usuario-titulo" class="font-headline font-extrabold text-2xl text-on-surface">Nuevo Usuario</h2>
            <button id="btn-cerrar-modal-usuario" class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <form id="form-usuario" class="flex flex-col gap-4">
            <input type="hidden" id="usuario-id" name="id" value="">
            
            <div class="space-y-1.5">
                <label class="font-label text-sm font-semibold text-on-surface-variant">Nombre Completo</label>
                <input type="text" id="usuario-nombre" required class="w-full bg-surface-container-highest text-on-surface font-medium rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-primary transition-all" placeholder="Ej. Juan Pérez">
            </div>

            <div class="space-y-1.5">
                <label class="font-label text-sm font-semibold text-on-surface-variant">Correo Electrónico</label>
                <input type="email" id="usuario-correo" required class="w-full bg-surface-container-highest text-on-surface font-medium rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-primary transition-all" placeholder="juan@email.com">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="font-label text-sm font-semibold text-on-surface-variant">Teléfono</label>
                    <input type="text" id="usuario-telefono" class="w-full bg-surface-container-highest text-on-surface font-medium rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-primary transition-all" placeholder="Opcional">
                </div>
                <div class="space-y-1.5">
                    <label class="font-label text-sm font-semibold text-on-surface-variant">Rol del Sistema</label>
                    <div class="relative">
                        <select id="usuario-rol" required class="w-full bg-none bg-surface-container-highest text-on-surface font-medium rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-primary transition-all appearance-none cursor-pointer">
                            <option value="CLIENTE">Cliente</option>
                            <option value="EMPLEADO">Empleado (Staff)</option>
                        </select>
                        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                    </div>
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="font-label text-sm font-semibold text-on-surface-variant">Contraseña</label>
                <input type="password" id="usuario-contrasena" class="w-full bg-surface-container-highest text-on-surface font-medium rounded-xl px-4 py-3 border-none focus:ring-2 focus:ring-primary transition-all" placeholder="Dejar en blanco para mantener la actual (solo edición)">
            </div>

            <div class="flex justify-end gap-3 mt-4">
                <button type="button" id="btn-cancelar-modal-usuario" class="px-6 py-3 rounded-xl font-headline font-bold text-secondary hover:bg-surface-container-highest transition-colors">Cancelar</button>
                <button type="submit" class="bg-primary text-on-primary px-6 py-3 rounded-xl font-headline font-bold flex items-center gap-2 hover:shadow-lg hover:shadow-primary/30 transition-all">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</dialog>

<div class="h-10"></div> 

<script src="js/controladores/admin-clientes.js"></script>
